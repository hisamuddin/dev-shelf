name: Deploy DevShelf Client to Azure Static Web Apps

on:
  push:
    branches: [main]
    paths:
      - "client/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy-client-azure.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build client
        run: npm run build

      - name: Validate Azure deployment configuration
        env:
          VITE_API_BASE_URL: ${{ env.VITE_API_BASE_URL }}
          AZURE_STATIC_WEB_APPS_API_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
        run: |
          test -n "$VITE_API_BASE_URL"
          test -n "$AZURE_STATIC_WEB_APPS_API_TOKEN"

      - name: Deploy client
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: client/dist
          skip_app_build: true
