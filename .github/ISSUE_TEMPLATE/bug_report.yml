name: Bug report
description: Report a reproducible problem in DevShelf.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Please do not include secrets, tokens, private data, or credentials.
  - type: textarea
    id: description
    attributes:
      label: Bug description
      description: What happened?
    validations:
      required: true
  - type: input
    id: component
    attributes:
      label: Affected component
      placeholder: client, server, cache, CI
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: OS, browser, Node.js version
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Redact secrets and personal data.
      render: text
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or API evidence
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - low
        - medium
        - high
        - critical
    validations:
      required: true
  - type: dropdown
    id: regression
    attributes:
      label: Regression
      options:
        - "No"
        - "Yes"
        - Unknown
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
  - type: checkboxes
    id: sensitive
    attributes:
      label: Sensitive data confirmation
      options:
        - label: I have removed secrets and sensitive data from this report.
          required: true
