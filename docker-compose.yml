services:
  mongodb:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - devshelf-mongo:/data/db
  server:
    build: ./server
    environment:
      NODE_ENV: development
      PORT: 5000
      CLIENT_URL: http://localhost:5173
      MONGODB_URI: mongodb://mongodb:27017/devshelf
      JWT_ACCESS_SECRET: devshelf-local-secret
    ports:
      - "5000:5000"
    depends_on:
      - mongodb
  client:
    build: ./client
    environment:
      VITE_API_BASE_URL: http://localhost:5000/api/v1
    ports:
      - "5173:5173"
    depends_on:
      - server
volumes:
  devshelf-mongo:
